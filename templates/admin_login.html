{% extends "layout.html" %}

{% block body %}

<h1>Admin Login</h1>

<form method="POST">

    <input 
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
    >
    <div>
        <label for="username">Username</label>

        <input
        type="text"
        id="username"
        name="username"
        required
        >
    </div>

    <div>
        <label for="password">Password</label>

        <input
        type="password"
        id="password"
        name="password"
        required
        >
    </div>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <button type="submit">
        Login
    </button>


</form>

{% endblock %}
